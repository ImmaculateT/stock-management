<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a2a2a">
  <meta name="description" content="Maricopa Concrete Stock Management System">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maricopa">

  <title>Maricopa Concrete · Loading</title>

 
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/download.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/download.png">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- No-JS fallback: if scripting is disabled, still reach home.html -->
  <noscript>
    <meta http-equiv="refresh" content="2; url=/home.html">
  </noscript>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      background: #1e2a36;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }

    .loader-container {
      background: #3e4e5e;
      padding: 2rem 2.5rem;
      border-radius: 40px 40px 20px 20px;
      box-shadow: 0 30px 30px -10px rgba(0,0,0,0.7),
                  inset 0 2px 5px rgba(255,255,255,0.1);
      text-align: center;
      max-width: 480px;
      width: 100%;
      border-bottom: 8px solid #2c3a48;
    }

    h1 {
      font-size: 1.9rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: #f0f4fa;
      text-shadow: 3px 3px 0 #1e2a36;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .subhead {
      color: #b0c4d9;
      font-size: 1rem;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-transform: uppercase;
      border-bottom: 2px dashed #5e7180;
      padding-bottom: 12px;
      display: inline-block;
    }

    .mixer-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0 20px;
    }

    .drum-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 10px;
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.5));
    }

    .drum {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 30%, #8a9aa8, #4a5a6a);
      border-radius: 50%;
      border: 8px solid #2e3e4e;
      box-shadow: inset 0 -15px 15px rgba(0,0,0,0.4),
                  inset 0 15px 15px rgba(255,255,255,0.1);
      animation: rotateDrum 6s infinite linear;
      position: relative;
      overflow: hidden;
    }

    .drum::after {
      content: "";
      position: absolute;
      top: 20%;
      left: 15%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle at 40% 40%, #b0b8c0, #6c7a88);
      border-radius: 40% 60% 50% 50% / 45% 50% 50% 55%;
      opacity: 0.55;
      filter: blur(3px);
      animation: slosh 2.4s infinite alternate ease-in-out;
    }

    .fin, .fin2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      pointer-events: none;
    }

    .fin::before, .fin::after,
    .fin2::before, .fin2::after {
      content: "";
      position: absolute;
      background: #2e3e4e;
      width: 6px;
      height: 48%;
      top: 0;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px 4px 0 0;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }

    .fin::before  { transform: translateX(-50%) rotate(25deg); }
    .fin::after   { transform: translateX(-50%) rotate(-25deg); }
    .fin2::before { transform: translateX(-50%) rotate(65deg); }
    .fin2::after  { transform: translateX(-50%) rotate(-65deg); }

    .chunk {
      position: absolute;
      background: #c0c8d0;
      border-radius: 40% 60% 40% 60% / 60% 40% 60% 40%;
      opacity: 0.8;
      box-shadow: 0 0 5px #a0a8b0;
      animation: chunkFloat 2.8s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .chunk:nth-child(1) { top: 15%;    left: 10%;  width: 18px; height: 18px; animation-delay: 0s;   }
    .chunk:nth-child(2) { bottom: 20%; right: 12%; width: 12px; height: 12px; animation-delay: 0.4s; }
    .chunk:nth-child(3) { top: 45%;    right: 8%;  width: 20px; height: 16px; animation-delay: 0.9s; }
    .chunk:nth-child(4) { bottom: 30%; left: 18%;  width: 10px; height: 10px; animation-delay: 1.3s; }

    .progress-section {
      width: 100%;
      margin: 25px 0 20px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: #d0dae6;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-track {
      background: #1e2a36;
      height: 20px;
      border-radius: 30px;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
      overflow: hidden;
      border: 1px solid #2e3e4e;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #cfd9e3, #9aacbc, #cfd9e3);
      border-radius: 30px;
      box-shadow: 0 0 12px #b0c8e0;
      animation: fillProgress 2.8s ease-in-out forwards;
    }

    @keyframes fillProgress {
      0%   { width: 0%;   }
      15%  { width: 18%;  }
      40%  { width: 45%;  }
      70%  { width: 80%;  }
      100% { width: 100%; }
    }

    .status-text {
      color: #ced9e3;
      font-size: 1rem;
      font-weight: 500;
      margin-top: 10px;
      background: #2e3e4e;
      padding: 10px 16px;
      border-radius: 40px;
      display: inline-block;
      box-shadow: inset 0 -2px 0 #1e2a36;
    }

    .install-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 3px solid #5a6a7a;
    }

    .btn-install {
      background: #3b6e4b;
      border: none;
      color: white;
      padding: 14px 28px;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 0 #1e2a36, 0 5px 15px rgba(0,0,0,0.4);
      transition: transform 0.08s, background 0.15s;
    }

    .btn-install:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #1e2a36;
    }

    .btn-install:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 8px 0 #1e2a36;
    }

    .hint {
      color: #a8bccc;
      font-size: 0.8rem;
      margin-top: 10px;
      font-style: italic;
      line-height: 1.4;
    }

    @keyframes rotateDrum { to { transform: rotate(360deg); } }
    @keyframes slosh      { to { transform: translate(5px, 10px) scale(1.05); } }
    @keyframes chunkFloat { to { transform: translateY(-12px) rotate(15deg); } }

    @media (max-width: 400px) {
      .loader-container { padding: 1.5rem 1rem; }
      h1 { font-size: 1.5rem; }
      .drum-wrapper { width: 140px; height: 140px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .drum, .drum::after, .chunk, .progress-fill {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .progress-fill { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <h1>Maricopa Concrete</h1>
    <div class="subhead">&amp; Allied Company</div>

    <div class="mixer-stage">
      <div class="drum-wrapper">
        <div class="drum">
          <div class="fin"></div>
          <div class="fin2"></div>
          <div class="chunk"></div>
          <div class="chunk"></div>
          <div class="chunk"></div>
          <div class="chunk"></div>
        </div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-label">
        <span>MIXING CONCRETE</span>
        <span id="percentDisplay">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="status-text" id="statusText">Pouring foundation...</div>
    </div>

    <div class="install-section">
      <button class="btn-install" id="installBtn" disabled>Install App</button>
      <div class="hint" id="installHint">
        On Android Chrome: menu → "Install app". On iOS Safari: Share → "Add to Home Screen".
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  
  const isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.matchMedia('(display-mode: fullscreen)').matches ||
    window.matchMedia('(display-mode: minimal-ui)').matches ||
    window.navigator.standalone === true; 

 
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function (err) {
        console.warn('[Maricopa] SW registration failed:', err);
      });
    });
  }

  
  const LOAD_DURATION_MS = 3200;
  const percentDisplay = document.getElementById('percentDisplay');
  const statusText     = document.getElementById('statusText');
  const progressFill   = document.getElementById('progressFill');

  let redirected = false;
  function goHome() {
    if (redirected) return;
    redirected = true;
    window.location.replace('/home.html');
  }

 
  const redirectTimer = setTimeout(goHome, LOAD_DURATION_MS + 800);

  
  let percent = 0;
  const tick = setInterval(function () {
    percent += 3.6; 
    if (percent > 100) percent = 100;

    percentDisplay.textContent = Math.floor(percent) + '%';

    if (percent < 30)      statusText.textContent = 'Mixing gravel & cement...';
    else if (percent < 60) statusText.textContent = 'Adding water & additives...';
    else if (percent < 90) statusText.textContent = 'Pouring concrete...';
    else                   statusText.textContent = 'Finishing & curing...';

    if (percent >= 100) {
      clearInterval(tick);
      statusText.textContent = 'Ready! Redirecting...';
      clearTimeout(redirectTimer);
      // Small buffer so the user sees "Ready!"
      setTimeout(goHome, 400);
    }
  }, 100);


  const installBtn  = document.getElementById('installBtn');
  const installHint = document.getElementById('installHint');

  function markInstalled() {
    installBtn.disabled   = true;
    installBtn.textContent = 'Already Installed';
    installHint.textContent = 'You are running the installed Maricopa Concrete app.';
  }

  if (isStandalone) {
    markInstalled();
  }

  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();         
    deferredPrompt = e;

    if (isStandalone) {
      
      markInstalled();
      return;
    }

    installBtn.disabled    = false;
    installBtn.textContent = 'Install Maricopa Concrete';
    installHint.textContent = 'Tap to install the app on this device.';
  });

  installBtn.addEventListener('click', async function () {
    if (!deferredPrompt) return;

    deferredPrompt.prompt();
    const choiceResult = await deferredPrompt.userChoice;

    if (choiceResult.outcome === 'accepted') {
      installBtn.textContent = 'Installing…';
      installBtn.disabled    = true;
    } else {
     
      installBtn.textContent = 'Install Maricopa Concrete';
    }

    deferredPrompt = null;
  });

  window.addEventListener('appinstalled', function () {
    markInstalled();
  });
})();
</script>
</body>
</html>
