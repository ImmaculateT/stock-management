<script>
(function(){try{var r=document.documentElement,m=localStorage.getItem('mrc.themeMode')||'system';
if(m==='system')m=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
if(m==='dark')r.setAttribute('data-theme','dark');
r.setAttribute('data-accent',localStorage.getItem('mrc.accent')||'amber');}catch(e){}})();

<style>
:root{--bg:#f4f7fc;--sf:#fff;--sf2:#f9fcff;--navy:#1a2b3c;--tx:#0b1d2e;--tx2:#5b6f84;--mu:#8da1b5;--bd:#e9eff6;--bd2:#dae3ec;--ac:#f0b34b;--acs:#d6952c;--acb:#fef4e6;--dg:#b13b3b;--dgb:#fff5f5;--dgbd:#f3cdcd;--ok:#1e6d3a;--okb:#e6f3e6;--wn:#b1590e;--wnb:#fff0e0;--sh:0 6px 18px rgba(0,0,0,.05)}
html[data-theme=dark]{--bg:#0e1720;--sf:#16222e;--sf2:#1b2a38;--navy:#0b141c;--tx:#e6eef7;--tx2:#9fb2c7;--mu:#6e8499;--bd:#22323f;--bd2:#2c4152;--acb:#2a2113;--dg:#f08a8a;--dgb:#2a1717;--dgbd:#4a2424;--ok:#6fd48f;--okb:#12261a;--wn:#f0b34b;--wnb:#2a2113;--sh:0 6px 18px rgba(0,0,0,.35)}
html[data-accent=blue]{--ac:#4d9fff;--acs:#2f6cb0}html[data-accent=green]{--ac:#4caf7d;--acs:#1e6d3a}html[data-accent=red]{--ac:#e05c5c;--acs:#b13b3b}html[data-accent=purple]{--ac:#8e5bbf;--acs:#6b3f99}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:1.5rem;letter-spacing:-.02em}header p{color:var(--tx2);font-size:.85rem;margin-top:3px}header p i{color:var(--acs);margin-right:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:40px;font-size:.9rem;font-weight:600;cursor:pointer;border:1px solid var(--bd2);background:var(--sf);color:var(--tx);text-decoration:none;transition:.15s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:hover:not(:disabled){border-color:var(--ac)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#f0e9df}.btn.pri i{color:var(--ac)}
.btn.sm{padding:8px 14px;font-size:.8rem}.btn.big{padding:14px 24px;font-size:1rem}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.banner{display:none;align-items:center;gap:10px;background:var(--dgb);border:1px solid var(--dgbd);color:var(--dg);padding:12px 16px;border-radius:14px;margin-bottom:14px;font-size:.85rem;font-weight:500;flex-wrap:wrap}
.banner.show{display:flex}.banner.info{background:var(--acb);border-color:var(--ac);color:var(--tx)}.banner button{margin-left:auto;background:var(--dg);color:#fff;border:0;padding:7px 16px;border-radius:40px;font-weight:600;cursor:pointer}

.card h2{font-size:1.05rem;margin-bottom:14px;display:flex;align-items:center;gap:10px}.card h2 i{color:var(--acs)}

.seg button.on{background:var(--navy);color:#fff}
.seg button.on i{color:var(--ac)}
.seg button:not(.on):hover{color:var(--tx)}
#modeHint{font-size:.78rem;color:var(--tx2);margin-top:8px}

.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .btn{flex:1;min-width:140px}

.prog{display:none;margin-top:14px}.prog .bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}.prog .bar div{height:100%;width:0;background:var(--ac);transition:width .2s}.prog p{font-size:.82rem;color:var(--tx2);margin-top:6px}
details{margin-top:14px}summary{cursor:pointer;font-size:.85rem;color:var(--tx2);font-weight:600}
textarea{width:100%;min-height:110px;margin-top:8px;padding:10px 12px;border:1px solid var(--bd2);border-radius:12px;background:var(--sf);color:var(--tx);font:.82rem ui-monospace,Menlo,monospace}
.line{border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--sf2);border-left:4px solid var(--ok);transition:.15s}
.line.warn{border-left-color:var(--ac)}.line.bad{border-left-color:var(--dg)}.line.off{opacity:.5}
.crop{display:block;width:100%;max-height:64px;object-fit:contain;object-position:left;background:#fff;border:1px solid var(--bd2);border-radius:8px;margin-bottom:10px}
.l-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}.l-top input[type=checkbox]{width:20px;height:20px;accent-color:var(--acs);flex-shrink:0}
input,select{padding:10px 12px;border:1px solid var(--bd2);border-radius:10px;font-size:.9rem;background:var(--sf);color:var(--tx);outline:none;width:100%}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(240,179,75,.18)}
.l-top input.nm{font-weight:600}select{margin-bottom:8px}
.nums{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}.nums label{font-size:.7rem;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.03em}.nums input{margin-top:3px}
.st{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:.78rem}
.st span{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}.st .ok{color:var(--ok)}.st .warn{color:var(--wn)}.st .bad{color:var(--dg)}.st .info{color:var(--tx2)}
.st .lnk{background:none;border:0;color:var(--acs);font-weight:700;cursor:pointer;text-decoration:underline;font-size:.78rem;display:inline-flex;gap:4px;align-items:center}.st .lnk input{width:auto}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);cursor:pointer;flex-shrink:0}.icon-btn:hover{color:var(--dg);border-color:var(--dgbd)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.sum div{background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:12px}.sum b{display:block;font-size:1.1rem}.sum small{color:var(--tx2);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
.sum label{font-size:.72rem;color:var(--tx2);text-transform:uppercase;font-weight:600}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--bd2);background:var(--sf2);color:var(--tx);border-radius:40px;padding:8px 14px;font-size:.85rem;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover,.chip.on{border-color:var(--ac);background:var(--acb)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,150%);background:var(--navy);color:#f0e9df;padding:13px 20px;border-radius:14px;border-left:4px solid var(--ac);font-size:.88rem;font-weight:500;z-index:50;transition:.3s;max-width:92vw;display:flex;gap:10px;align-items:center}
.toast.show{transform:translate(-50%,0)}.toast.error{border-left-color:var(--dg)}
@media(max-width:520px){.nums{grid-template-columns:1fr 1fr}.nums label:last-child{grid-column:1/-1}.btn.big{width:100%}.seg{width:100%}.seg button{flex:1;justify-content:center;font-size:.8rem;padding:10px 8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header>
    <div><h1 id="h1">Scan receipt</h1><p id="sub"><i class="fas fa-hard-hat"></i> Maricopa · update stock from a receipt</p></div>
    <a class="btn" id="back" href="inventory.html"><i class="fas fa-boxes"></i> Inventory</a>
  </header>

  <div class="banner" id="banner"><i class="fas fa-plug-circle-exclamation"></i><span id="bannerMsg"></span><button id="retry">Retry</button></div>

  <div class="card">
    <h2><i class="fas fa-camera"></i> 1. Capture <span id="capWhat">receipt</span></h2>
    <div style="margin-bottom:14px" id="modeRow">
      <div class="seg" id="modeSeg" role="tablist" aria-label="Stock direction">
        <button data-mode="in" class="on" role="tab" aria-selected="true"><i class="fas fa-arrow-down"></i> Stock in (delivery)</button>
        <button data-mode="out" role="tab" aria-selected="false"><i class="fas fa-arrow-up"></i> Stock out (sale / issue)</button>
      </div>
      <div id="modeHint">Quantities will be <b>added</b> to the current balance.</div>
    </div>
    <div class="actions">
      <button class="btn pri big" id="btnCam"><i class="fas fa-camera"></i> Take photo</button>
      <button class="btn big" id="btnUp"><i class="fas fa-image"></i> Upload image</button>
      <button class="btn big" id="btnManual"><i class="fas fa-plus"></i> Add line manually</button>
    </div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileUp" accept="image/*" hidden>
    <div id="preview"><canvas id="cv"></canvas>
      <div class="pv-actions"><button class="btn sm" id="btnRot"><i class="fas fa-rotate-right"></i> Rotate &amp; re-read</button><button class="btn sm" id="btnAgain"><i class="fas fa-magnifying-glass"></i> Re-read photo</button></div></div>
    <div class="prog" id="prog"><div class="bar"><div id="progBar"></div></div><p id="progTxt">Starting…</p></div>
    <details><summary><i class="fas fa-file-lines"></i> Scanned text (edit if needed)</summary>
      <textarea id="ocrText" placeholder="Text read from the photo appears here. One item per line: name  qty  unit price  total"></textarea>
      <button class="btn sm" id="btnReparse" style="margin-top:8px"><i class="fas fa-rotate"></i> Re-read lines from text</button></details>
  </div>

  <div class="card" id="pick" style="display:none">
    <h2><i class="fas fa-hand-pointer"></i> 2. Tap the text you want</h2>
    <div class="chips" id="chips"></div>
    <label for="pickVal" style="font-size:.8rem;font-weight:600;color:var(--tx2)">Text to use (you can edit it)</label>
    <input id="pickVal" style="margin:6px 0 14px" autocomplete="off">
    <div class="foot"><a class="btn" id="cancelPick" href="inventory.html">Cancel</a><button class="btn pri big" id="usePick"><i class="fas fa-check"></i> Use this text</button></div>
  </div>

  <div class="card" id="review" style="display:none">
    <h2><i class="fas fa-list-check"></i> 2. Review and apply <span id="modeTag" style="font-weight:500;color:var(--tx2);font-size:.85rem"></span></h2>
    <div id="lines"></div>
    <div class="sum">
      <div><small>Lines selected</small><b id="sCount">0</b></div>
      <div><small>Sum of totals</small><b id="sTotal">KSH 0.00</b></div>
      <div><label for="rcptTotal">Receipt grand total</label><input type="number" id="rcptTotal" step="any" inputmode="decimal" placeholder="e.g. 46980"><small id="sDiff" style="display:block;margin-top:4px"></small></div>
    </div>
    <div class="foot">
      <button class="btn" id="btnClear"><i class="fas fa-trash-can"></i> Clear lines</button>
      <button class="btn pri big" id="btnApply"><i class="fas fa-check"></i> Apply to inventory</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
(function(){
'use strict';
var API='https://stock-backend-3-r6rq.onrender.com';
var $=function(i){return document.getElementById(i)};
var Q=new URLSearchParams(location.search),FIELD=Q.get('field')||'',
    RET=/^[\w\-.\/]+\.html$/.test(Q.get('return')||'')?Q.get('return'):'inventory.html',
    FM=!!FIELD&&FIELD!=='receipt';
var items=[],rows=[],mode='in',uid=0,src=null,busy=false,aliases={},dirty=false;
var toastQ=[],toastActive=false,tT=null;
try{aliases=JSON.parse(localStorage.getItem('mrc.aliases')||'{}')}catch(e){}

function money(n){return 'KSH '+(Number(n)||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(n){return Number(n||0).toLocaleString('en-KE')}
function r2(n){return Math.round(n*100)/100}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ---- toast queue: never swallow a message ---- */
function toast(m,t){
  toastQ.push({m:m,t:t});drainToasts();
}
function drainToasts(){
  if(toastActive||!toastQ.length)return;
  toastActive=true;var x=toastQ.shift();
  $('toastMsg').textContent=x.m;$('toast').className='toast show'+(x.t==='error'?' error':'');
  clearTimeout(tT);tT=setTimeout(function(){
    $('toast').classList.remove('show');
    setTimeout(function(){toastActive=false;drainToasts()},320);
  },4200);
}

function api(path,opt,ms){
  var c=new AbortController(),t=setTimeout(function(){c.abort()},ms||90000);
  opt=opt||{};opt.signal=c.signal;opt.headers=Object.assign({Accept:'application/json'},opt.headers||{});
  return fetch(API+path,opt).then(function(r){clearTimeout(t);
    if(!r.ok)return r.json().catch(function(){return {}}).then(function(b){throw new Error(b.error||('Request failed ('+r.status+')'))});
    return r.status===204?null:r.json().catch(function(){return null})
  },function(){clearTimeout(t);throw new Error('Server not reachable')});
}
function banner(show,msg,info){var b=$('banner');b.className='banner'+(show?' show':'')+(info?' info':'');if(msg)$('bannerMsg').textContent=msg;$('retry').style.display=info?'none':''}
function loadItems(){
  banner(true,'Connecting to the server… it can take up to a minute to wake up.',true);
  return api('/inventory').then(function(d){items=Array.isArray(d)?d:[];banner(false);render()})
  .catch(function(e){banner(true,'Cannot load inventory: '+e.message+'. Check your connection and retry.')});
}

/* ================= matching ================= */
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9.]+/g,' ').trim()}
function toks(s){return norm(s).split(' ').filter(Boolean)}
function tm(x,y){return x===y||(x.length>=3&&y.indexOf(x)===0)||(y.length>=3&&x.indexOf(y)===0)}
function score(a,b){var A=toks(a),B=toks(b);if(!A.length||!B.length)return 0;
  var i=0;A.forEach(function(x){if(B.some(function(y){return tm(x,y)}))i++});
  return i/Math.min(A.length,B.length)*.6+i/(A.length+B.length-i)*.4}
function matchItem(name,price){
  var k=norm(name),id=aliases[k];if(id&&items.some(function(i){return i.id===id}))return id;
  var best=0,bid='';
  items.forEach(function(it){var s=Math.max(score(name,it.name),score(name,it.sku));
    if(price>0&&it.price>0&&Math.abs(price-it.price)/it.price<.01)s+=.25;
    if(s>best){best=s;bid=it.id}});
  return best>=.4?bid:'';
}
function itemOf(id){return items.find(function(i){return i.id===id})}
function canon(u){u=String(u||'').toLowerCase().replace(/[^a-z0-9³]/g,'').replace('m3','m³').replace(/s$/,'');
  return /^(piece|pc|no|unit)$/.test(u)?'pc':/^(tonne|ton)$/.test(u)?'ton':/^(litre|liter|ltr)$/.test(u)?'litre':u}

/* ================= number reading ================= */
function near(a,b){return Math.abs(a-b)<=Math.max(.5,Math.abs(b)*.006)}
function toNum(t){
  t=String(t).trim().replace(/[.,:;]+$/,'');
  if(!/^[\dOolI|SBZ.,]+$/.test(t)||!/\d/.test(t))return null;
  t=t.replace(/[Oo]/g,'0').replace(/[lI|]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2');
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t))t=t.replace(/,/g,'');
  else if(/^\d+,\d{1,2}$/.test(t))t=t.replace(',','.');
  else t=t.replace(/,/g,'');
  return /^\d+(\.\d+)?$/.test(t)?parseFloat(t):null;
}
// Plausibility: no real receipt has qty>10k or unit price>1M or total<qty*price/100
function plausible(q,p,t){
  if(q>10000||p>1000000||t>100000000)return false;
  if(q>0&&p>0&&t>0&&t<q*p/100)return false;
  return true;
}
// Brute-force: try every triple of trailing numbers to find q × p = t
function assign(n,lead){
  if(!n.length)return null;
  var tail=n.slice(-4),best=null,i,j,k;
  for(i=0;i<tail.length;i++)for(j=0;j<tail.length;j++)for(k=0;k<tail.length;k++){
    if(i===j||j===k||i===k)continue;
    var a=tail[i],b=tail[j],c=tail[k];
    if(a>0&&b>0&&c>0&&near(a*b,c)&&plausible(a,b,c)){
      var q=a,p=b,t=c;
      if(Number.isInteger(b)&&!Number.isInteger(a)){q=b;p=a}
      if(!best||Math.abs(a*b-c)<Math.abs(best.q*best.p-best.t))
        best={q:q,p:p,t:t,ok:1};
    }
  }
  if(best)return best;
  if(lead!=null&&n.length>=2&&near(lead*n[n.length-2],n[n.length-1]))
    return{q:lead,p:n[n.length-2],t:n[n.length-1],ok:1,lead:1};
  // P0 FIX: two numbers means qty,total (NOT price,total)
  if(n.length>=2){
    var q0=n[n.length-2],t0=n[n.length-1];
    if(q0>0&&t0>0)return{q:q0,p:r2(t0/q0),t:t0,ok:0,derived:1};
  }
  return{q:n[0],p:0,t:0,ok:0,derived:1};
}
var UNITS=/^(bags?|pcs?|pieces?|nos?|tons?|tonnes?|kgs?|kilos?|ltrs?|litres?|liters?|m3|m³|pallets?|lengths?|rolls?|sheets?|trips?|tins?|buckets?|bundles?|drums?|cartons?|box|boxes|pkt|packets?)$/i;
var SKIP=/\b(sub\s?total|total|vat|tax|change|cash|balance|amount|tendered|mpesa|card|date|receipt|invoice|tel|thank|served|discount)\b/i;
var JUNK=/^([x×@=*:\-]|ksh\.?|kes\.?|sh\.?|\/=)$/i;

function parseTokens(tk){
  var t=[];
  tk.forEach(function(w){var m=w.t.match(/^(\d+[.,]?\d*)\s*[x×*@]\s*(\d.*)$/i);
    if(m){t.push({t:m[1],b:w.b});t.push({t:m[2],b:w.b})}else t.push(w)});
  t=t.filter(function(w){return w.t&&!JUNK.test(w.t)});
  var tail=[];
  while(t.length&&tail.length<4){var v=toNum(t[t.length-1].t);if(v==null)break;var w=t.pop();tail.unshift({v:v,b:w.b})}
  if(!tail.length)return null;
  var unit='';
  if(t.length>1&&UNITS.test(t[t.length-1].t))unit=t.pop().t;
  var lead=null;
  if(t.length>1&&tail.length>=2){
    var lv=toNum(t[0].t);
    if(lv!=null&&lv>0&&lv<10000&&!/[.)]$/.test(t[0].t))lead=lv;
  }
  var n=tail.map(function(x){return x.v}),a=assign(n,lead);
  if(!a)return null;
  var nameToks=t.slice();if(a.lead)nameToks.shift();
  var name=nameToks.map(function(w){return w.t}).join(' ')
    .replace(/^\d{1,2}[.)]\s*/,'')
    .replace(/[^\w\s\-\/.()%'"×]/g,' ')
    .replace(/\s+/g,' ').trim();
  var xs=tail.map(function(x){return x.b}).filter(Boolean);
  return{name:name,unit:unit,q:a.q,p:a.p,t:a.t,ok:a.ok,derived:a.derived,lead:lead,
    nb:xs.length?{x0:Math.min.apply(0,xs.map(function(b){return b.x0})),
                  x1:Math.max.apply(0,xs.map(function(b){return b.x1})),
                  y0:Math.min.apply(0,xs.map(function(b){return b.y0})),
                  y1:Math.max.apply(0,xs.map(function(b){return b.y1}))}:null};
}
function lastNum(tk){for(var i=tk.length-1;i>=0;i--){var v=toNum(tk[i].t);if(v!=null)return v}return null}

function parseData(data){
  var out=[],pend=null,grand=0,sub=0,unnamed=0;
  (data.lines||[]).forEach(function(L){
    var tk=(L.words||[]).map(function(w){return{t:w.text,b:w.bbox}}).filter(function(w){return w.t&&w.t.trim()});
    if(!tk.length)return;
    var txt=(L.text||'').trim();
    if(SKIP.test(txt)){
      if(/\b(total|amount\s*due)\b/i.test(txt)){var v=lastNum(tk);if(v!=null){if(/sub/i.test(txt))sub=Math.max(sub,v);else grand=Math.max(grand,v)}}
      pend=null;return}
    var p=parseTokens(tk);
    if(!p){
      // P0 FIX: preserve numeric-only lines as "(line N)" instead of dropping them
      pend=(/[a-z]{3,}/i.test(txt)&&!/\d{3,}/.test(txt))?{name:txt.replace(/[^\w\s\-\/.()%'"]/g,' ').trim(),b:L.bbox}:null;
      // If this line has numbers but no letters, still try to keep it
      if(!pend&&/\d/.test(txt)&&!/[a-z]/i.test(txt)){
        var nums=txt.match(/\d[\d.,]*/g)||[];
        if(nums.length>=1)unnamed++;
      }
      return}
    var bb={x0:L.bbox.x0,x1:L.bbox.x1,y0:L.bbox.y0,y1:L.bbox.y1};
    if(!/[a-z]{2}/i.test(p.name)){
      if(pend){p.name=pend.name;bb.y0=Math.min(bb.y0,pend.b.y0);bb.x0=Math.min(bb.x0,pend.b.x0)}
      else{p.name='(line '+(++unnamed)+')'}  // keep it
    }
    pend=null;
    // P0 FIX: only reject if name has no letters AND no placeholder — keep unnamed numeric lines
    if(p.name.length<2&&!/[a-z]/i.test(p.name))return;
    p.bb=bb;out.push(p);
  });
  return{rows:out,grand:grand||sub};
}

/* ================= consensus + inventory cross-check ================= */
function same(a,b){return near(a.q,b.q)&&near(a.p,b.p)&&near(a.t,b.t)}
function pair(A,B){
  var used={},res=[];
  A.forEach(function(a){var bi=-1,bs=0;
    B.forEach(function(b,i){if(used[i])return;var s=score(a.name,b.name);if(s>bs){bs=s;bi=i}});
    a.cands=[a];if(bs>=.55){used[bi]=1;a.cands.push(B[bi])}res.push(a)});
  B.forEach(function(b,i){if(!used[i]&&b.ok&&matchItem(b.name,b.p)){b.cands=[b];res.push(b)}});
  return res;
}
function decide(r){
  var id=matchItem(r.name,r.p),it=itemOf(id),good=r.cands.filter(function(c){return c.ok}),pick=r,first=r.ok;
  r.conf='check';r.why='';r.notes=[];
  if(good.length>1&&same(good[0],good[1])){pick=good[0];r.conf='verified';r.why='Read twice from the photo — both reads agree'}
  else if(good.length){
    pick=good[0];
    if(it){var m=good.filter(function(c){return near(c.p,Number(it.price))})[0];if(m)pick=m}
    r.conf='ok';
    if(!first)r.notes.push(['info','The second read of the photo corrected the numbers.']);
  }
  if(r.conf!=='check'&&it&&near(pick.p,Number(it.price))){r.conf='verified';r.why='Matches the inventory price'}
  var keep={name:r.name,bb:r.bb,cands:r.cands,conf:r.conf,why:r.why,notes:r.notes};
  ['q','p','t','ok','derived','lead','unit'].forEach(function(k){if(pick[k]!==undefined&&(k!=='unit'||pick[k]))r[k]=pick[k]});
  r.nb=pick.nb||r.nb;r.name=keep.name;r.bb=keep.bb;r.cands=keep.cands;r.itemId=id;
}
async function reread(w,r,pre){
  if(!r.nb)return false;
  for(var k=0;k<2;k++){
    var c=crop(k?getB(pre):pre.a,{x0:r.nb.x0-12,x1:r.nb.x1+12,y0:r.nb.y0-5,y1:r.nb.y1+5},90);
    var res=await w.recognize(c);
    var n=(res.data.text.match(/\d[\d.,]*/g)||[]).map(toNum).filter(function(v){return v!=null});
    if(n.length>=2){var a=assign(n.slice(-4),r.lead);
      if(a&&a.ok&&plausible(a.q,a.p,a.t)){r.q=a.q;r.p=a.p;r.t=a.t;r.ok=1;r.derived=0;r.conf='ok';r.notes.push(['info','Fixed by zooming in and re-reading the numbers.']);return true}}
  }
  return false;
}
function repair(r){
  // Never overwrite a verified read
  if(r.ok||r.conf==='verified')return;
  var it=itemOf(r.itemId);if(!it)return;
  var P=Number(it.price),q=r.q,t=r.t;if(!(P>0)||!(t>0))return;
  var orig=num(q)+' × '+num(r.p)+' = '+num(t),k=Math.round(t/P);
  if(q>0&&near(q*P,t))r.p=P;
  else if(k>0&&near(k*P,t)&&near(r.p,P))r.q=k;
  else if(q>0&&near(r.p,P))r.t=r2(q*P);
  else return;
  r.ok=1;r.derived=0;r.conf='check';
  r.notes.push(['warn','Adjusted using the inventory price ('+money(P)+'). Receipt was read as '+orig+'. Compare with the photo strip above.']);
}

/* ================= image preprocessing ================= */
function mk(W,H,g){var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d'),d=x.createImageData(W,H),p=d.data;
  for(var i=0;i<g.length;i++){p[i*4]=p[i*4+1]=p[i*4+2]=g[i];p[i*4+3]=255}x.putImageData(d,0,0);return c}
function preprocess(s0){
  var s=1600/s0.width,mx=Math.max(s0.width,s0.height);if(mx*s>2200)s=2200/mx;if(s>2.5)s=2.5;
  var W=Math.round(s0.width*s),H=Math.round(s0.height*s),c=document.createElement('canvas');c.width=W;c.height=H;
  var x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(s0,0,0,W,H);
  var p=x.getImageData(0,0,W,H).data,N=W*H,g=new Uint8Array(N),h=new Uint32Array(256),i,y,xx;
  for(i=0;i<N;i++){var v=(.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2])|0;g[i]=v;h[v]++}
  var lo=0,hi=255,ac=0;
  for(i=0;i<256;i++){ac+=h[i];if(ac>N*.01){lo=i;break}}
  ac=0;for(i=255;i>=0;i--){ac+=h[i];if(ac>N*.01){hi=i;break}}
  var rg=Math.max(40,hi-lo);
  for(i=0;i<N;i++){var u=(g[i]-lo)*255/rg;g[i]=u<0?0:u>255?255:u}
  return{a:mk(W,H,g),g:g,W:W,H:H,b:null};
}
function makeB(pre){
  var W=pre.W,H=pre.H,g=pre.g,N=W*H,I=new Uint32Array((W+1)*(H+1)),row,y,xx,r=Math.max(12,(W/24)|0),b=new Uint8Array(N);
  for(y=1;y<=H;y++){row=0;for(xx=1;xx<=W;xx++){row+=g[(y-1)*W+xx-1];I[y*(W+1)+xx]=I[(y-1)*(W+1)+xx]+row}}
  for(y=0;y<H;y++){var y0=Math.max(0,y-r),y1=Math.min(H,y+r+1);
    for(xx=0;xx<W;xx++){var x0=Math.max(0,xx-r),x1=Math.min(W,xx+r+1);
      var m=(I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0])/((x1-x0)*(y1-y0));
      b[y*W+xx]=g[y*W+xx]<m*.88?0:255}}
  return mk(W,H,b);
}
function getB(pre){return pre.b||(pre.b=makeB(pre))}
function crop(cv,b,th,maxW){
  var x0=Math.max(0,b.x0|0),y0=Math.max(0,b.y0|0),x1=Math.min(cv.width,b.x1|0),y1=Math.min(cv.height,b.y1|0),
      w=Math.max(4,x1-x0),h=Math.max(4,y1-y0),s=th?Math.max(1,Math.min(3,th/h)):Math.min(1,(maxW||720)/w),pad=th?12:0,
      c=document.createElement('canvas');
  c.width=Math.round(w*s)+pad*2;c.height=Math.round(h*s)+pad*2;
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.drawImage(cv,x0,y0,w,h,pad,pad,Math.round(w*s),Math.round(h*s));return c;
}

/* ================= OCR pipeline ================= */
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise(function(res,rej){var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js';s.onload=res;
    s.onerror=function(){rej(new Error('Could not load the text reader. Check your internet.'))};document.head.appendChild(s)});
}
function prog(p,t){$('prog').style.display='block';$('progBar').style.width=Math.round(p*100)+'%';$('progTxt').textContent=t}
function showSrc(){var cv=$('cv');cv.width=src.width;cv.height=src.height;cv.getContext('2d').drawImage(src,0,0);$('preview').style.display='block'}
function loadImage(file){
  if(!file)return;
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){
    var s=Math.min(1,3200/Math.max(img.naturalWidth,img.naturalHeight));
    src=document.createElement('canvas');src.width=Math.round(img.naturalWidth*s);src.height=Math.round(img.naturalHeight*s);
    src.getContext('2d').drawImage(img,0,0,src.width,src.height);URL.revokeObjectURL(url);showSrc();runOcr();
  };
  img.onerror=function(){toast('Could not open that image.','error')};
  img.src=url;
}
function rotate(){
  var c=document.createElement('canvas');c.width=src.height;c.height=src.width;var x=c.getContext('2d');
  x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(src,0,0);src=c;showSrc();
}

var wk=null,stage=0;
function getWorker(){
  if(!wk)wk=loadTess().then(function(){
    return Tesseract.createWorker('eng',1,{logger:function(m){
      if(busy&&m.status==='recognizing text')prog(stage?.7+m.progress*.2:.1+m.progress*.6,stage?'Double-checking doubtful lines…':'Reading the photo… '+Math.round(m.progress*100)+'%')}});
  }).then(function(w){return w.setParameters({preserve_interword_spaces:'1'}).then(function(){return w})});
  wk.catch(function(){wk=null});
  return wk;
}

async function runOcr(){
  if(busy||!src)return;busy=true;summary();stage=0;
  try{
    prog(.03,'Preparing the photo…');
    var wp=getWorker(),ip=(!FM&&!items.length)?loadItems():null;
    var pre=await new Promise(function(r){setTimeout(function(){r(preprocess(src))},20)});
    prog(.08,'Starting the reader…');
    var w=await wp;
    await w.setParameters({tessedit_char_whitelist:'',tessedit_pageseg_mode:'6'});
    var ra=await w.recognize(pre.a);
    $('ocrText').value=ra.data.text;
    if(FM){showPicks(ra.data,{});return}
    if(ip)await ip;
    var pa=parseData(ra.data),pb=null,list=pair(pa.rows,[]);
    list.forEach(decide);
    var weak1=list.filter(function(r){return !r.ok}).length;
    // P1 FIX: only re-OCR if zero lines OR more than one weak line
    if(!list.length||weak1>1){
      stage=1;prog(.7,'Double-checking doubtful lines…');
      var rb=await w.recognize(getB(pre));pb=parseData(rb.data);
      list=pair(pa.rows,pb.rows);list.forEach(decide);
    }
    if(!list.length){toast('No item lines found. Retake the photo (flat, well lit), try Rotate, or add lines manually.','error');return}
    var weak=list.filter(function(r){return !r.ok});
    if(weak.length){
      await w.setParameters({tessedit_char_whitelist:'0123456789.,',tessedit_pageseg_mode:'7'});
      for(var i=0;i<weak.length;i++){prog(.9+.08*(i/weak.length),'Zooming in on line '+(i+1)+' of '+weak.length+'…');
        try{await reread(w,weak[i],pre)}catch(e){}}
    }
    list.forEach(function(r){if(!r.ok)repair(r)});
    rows=list.map(function(r){
      var o=addRow({name:r.name,qty:r.q,price:r.p,total:r.t,unit:r.unit,itemId:r.itemId,conf:r.conf,why:r.why,notes:r.notes});
      if(r.bb)o.img=crop(pre.a,{x0:r.bb.x0-10,x1:r.bb.x1+10,y0:r.bb.y0-6,y1:r.bb.y1+6},0,720).toDataURL('image/jpeg',.75);
      if(r.derived&&!r.ok)o.notes.push(['warn','Unit price was worked out from the total; only the total was read.']);
      return o});
    var g=pa.grand||(pb&&pb.grand);if(g)$('rcptTotal').value=g;
    render();saveDraft();
    var bad=rows.filter(function(r){return r.conf==='check'}).length;
    toast(rows.length+' line'+(rows.length>1?'s':'')+' read'+(bad?' — '+bad+' need a quick check.':' and cross-checked.'),bad?'error':'');
    $('review').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){toast(e.message||'Scan failed.','error')}
  finally{busy=false;$('prog').style.display='none';summary()}
}
function addRow(o){
  var r={id:++uid,name:o.name||'',qty:o.qty==null?'':o.qty,price:o.price==null?'':o.price,total:o.total==null?'':o.total,unit:o.unit||'',
    itemId:o.itemId!==undefined?o.itemId:'',include:true,updPrice:false,conf:o.conf||'',why:o.why||'',notes:o.notes||[],img:''};
  if(o.itemId===undefined)r.itemId=o.name?matchItem(o.name,+o.price):'';
  rows.push(r);return r;
}
function parseText(text){
  var data={lines:text.split(/\r?\n/).map(function(l){return{text:l,bbox:{x0:0,y0:0,x1:0,y1:0},words:l.split(/\s+/).filter(Boolean).map(function(w){return{text:w,bbox:null}})}})};  
  return parseData(data).rows;
}

/* ================= field mode ================= */
function go(v){location.href=RET+(RET.indexOf('?')<0?'?':'&')+'scanned='+encodeURIComponent(v)+'&field='+encodeURIComponent(FIELD)}
function showPicks(a,b){
  var seen={},list=[],wantCode=FIELD==='sku'||FIELD==='lookup';
  function add(s){s=String(s||'').replace(/\s+/g,' ').trim();var k=s.toLowerCase();
    if(s.length<2||s.length>60||seen[k]||!/[a-z0-9]/i.test(s))return;seen[k]=1;list.push(s)}
  var words=[];[a,b].forEach(function(d){(d.words||[]).forEach(function(w){if(w.confidence>55&&/^[\w\-\/.]{3,}$/.test(w.text))words.push(w.text)})});
  var lines=[];[a,b].forEach(function(d){(d.lines||[]).forEach(function(l){lines.push(l.text)})});
  if(wantCode){words.filter(function(w){return /\d/.test(w)}).forEach(add);lines.forEach(add);words.forEach(add)}
  else{lines.forEach(add);words.forEach(add)}
  $('chips').innerHTML=list.slice(0,28).map(function(s){return '<button class="chip" data-v="'+esc(s)+'">'+esc(s)+'</button>'}).join('')||'<span style="color:var(--mu)">No text found. Retake the photo or type it below.</span>';
  $('pick').style.display='block';if(list[0])$('pickVal').value=wantCode?list[0]:'';
  $('pick').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ================= review UI ================= */
function check(r){
  var o=[],it=itemOf(r.itemId),q=parseFloat(r.qty),p=parseFloat(r.price),t=parseFloat(r.total);
  if(r.conf==='verified')o.push(['ok','✓ '+(r.why||'Verified')]);
  (r.notes||[]).forEach(function(n){o.push(n)});
  if(r.applyErr)o.push(['bad',r.applyErr]);
  if(!it)o.push(['bad','Pick the matching stock item']);
  if(!(q>0))o.push(['bad','Enter a quantity']);
  else if(isFinite(p)&&isFinite(t)&&!near(q*p,t))
    o.push(['warn','Qty × price = '+money(q*p)+' but total is '+money(t)+' <button class="lnk" data-act="fix">Use '+money(q*p)+'</button>']);
  else if(r.conf!=='verified'&&isFinite(p)&&isFinite(t)&&q>0)o.push(['ok','Qty × price = total']);
  if(it&&q>0){
    var cur=Number(it.quantity)||0;
    if(mode==='out'&&q>cur)o.push(['bad','Only '+num(cur)+' '+(it.unit||'')+' in stock']);
    if(mode==='in'&&p>0&&Math.abs(p-Number(it.price))>.005)
      o.push(['warn','Price '+money(it.price)+' → '+money(p)+' <label class="lnk"><input type="checkbox" data-f="updPrice"'+(r.updPrice?' checked':'')+'> update price</label>']);
    if(r.unit&&it.unit&&canon(r.unit)!==canon(it.unit))o.push(['warn','Receipt says “'+esc(r.unit)+'” but this item is counted in '+esc(it.unit)]);
    o.push(['info','Balance: '+num(cur)+' → '+num(mode==='out'?cur-q:cur+q)+' '+(it.unit||'')]);
  }
  return o;
}
function cls(c){return c.some(function(x){return x[0]==='bad'})?'bad':c.some(function(x){return x[0]==='warn'})?'warn':''}
function refresh(r){
  var el=document.querySelector('.line[data-id="'+r.id+'"]');if(!el)return;
  var c=check(r);el.className='line '+cls(c)+(r.include?'':' off');
  el.querySelector('.st').innerHTML=c.map(function(x){return '<span class="'+x[0]+'">'+x[1]+'</span>'}).join('');summary();
}
function summary(){
  var sel=rows.filter(function(r){return r.include}),s=0;sel.forEach(function(r){s+=parseFloat(r.total)||0});
  $('sCount').textContent=sel.length;$('sTotal').textContent=money(s);
  var g=parseFloat($('rcptTotal').value),d=$('sDiff');
  if(isFinite(g)){var diff=r2(s-g);d.textContent=Math.abs(diff)<1?'✓ Matches the receipt total':'Difference: '+money(diff)+' — check flagged lines';d.style.color=Math.abs(diff)<1?'var(--ok)':'var(--dg)'}else d.textContent='';
  $('btnApply').innerHTML='<i class="fas fa-check"></i> Apply '+sel.length+' line'+(sel.length===1?'':'s');
  $('btnApply').disabled=busy||!sel.length;
}
function render(){
  if(FM)return;
  $('review').style.display=rows.length?'block':'none';
  $('modeTag').textContent=mode==='in'?'· Stock in (adds to quantity)':'· Stock out (subtracts from quantity)';
  var sorted=items.slice().sort(function(a,b){return String(a.name).localeCompare(b.name)});
  $('lines').innerHTML=rows.map(function(r){
    var opts='<option value="">— Pick stock item —</option>'+sorted.map(function(i){
      return '<option value="'+esc(i.id)+'"'+(i.id===r.itemId?' selected':'')+'>'+esc(i.name)+' · '+esc(i.sku)+'</option>'}).join('');
    return '<div class="line" data-id="'+r.id+'">'+(r.img?'<img class="crop" src="'+r.img+'" alt="Receipt line as photographed">':'')+
    '<div class="l-top"><input type="checkbox" data-f="include"'+(r.include?' checked':'')+' aria-label="Include line">'+
    '<input class="nm" data-f="name" value="'+esc(r.name)+'" placeholder="Receipt item name"><button class="icon-btn" data-act="del" aria-label="Remove line"><i class="fas fa-trash"></i></button></div>'+
    '<select data-f="itemId">'+opts+'</select><div class="nums">'+
    '<label>Qty<input type="number" inputmode="decimal" step="any" data-f="qty" value="'+esc(r.qty)+'"></label>'+
    '<label>Unit price<input type="number" inputmode="decimal" step="any" data-f="price" value="'+esc(r.price)+'"></label>'+
    '<label>Total<input type="number" inputmode="decimal" step="any" data-f="total" value="'+esc(r.total)+'"></label></div><div class="st"></div></div>';
  }).join('');
  rows.forEach(refresh);summary();
}
function rowOf(el){var l=el.closest('.line');return l&&rows.find(function(r){return r.id==l.dataset.id})}
$('lines').addEventListener('input',function(e){
  var t=e.target,f=t.dataset.f,r=rowOf(t);if(!r||!f||f==='itemId')return;
  r[f]=t.type==='checkbox'?t.checked:t.value;
  if(f==='qty'||f==='price'){var q=parseFloat(r.qty),p=parseFloat(r.price);if(q>0&&p>=0){r.total=r2(q*p);var ti=t.closest('.line').querySelector('[data-f=total]');if(ti)ti.value=r.total}}
  r.applyErr='';refresh(r);saveDraft();
});
$('lines').addEventListener('change',function(e){var t=e.target,r=rowOf(t);if(r&&t.dataset.f==='itemId'){r.itemId=t.value;r.updPrice=false;r.conf=r.conf==='verified'?'ok':r.conf;r.applyErr='';refresh(r);saveDraft()}});
$('lines').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var r=rowOf(b);if(!r)return;
  if(b.dataset.act==='del'){rows=rows.filter(function(x){return x!==r});render();saveDraft()}
  if(b.dataset.act==='fix'){r.total=r2(parseFloat(r.qty)*parseFloat(r.price));render();saveDraft()}
});
$('rcptTotal').addEventListener('input',function(){summary();saveDraft()});

/* ---- draft persistence (crash / refresh recovery) ---- */
function saveDraft(){
  if(FM)return;
  try{
    if(!rows.length){localStorage.removeItem('mrc.scanDraft');return}
    var d={mode:mode,rows:rows.map(function(r){return{id:r.id,name:r.name,qty:r.qty,price:r.price,total:r.total,unit:r.unit,itemId:r.itemId,include:r.include,updPrice:r.updPrice,conf:r.conf,why:r.why,notes:r.notes}}),rcptTotal:$('rcptTotal').value};
    localStorage.setItem('mrc.scanDraft',JSON.stringify(d));
  }catch(e){}
}
function loadDraft(){
  try{
    var d=JSON.parse(localStorage.getItem('mrc.scanDraft')||'null');if(!d||!d.rows||!d.rows.length)return false;
    mode=d.mode||'in';rows=d.rows;uid=Math.max.apply(0,rows.map(function(r){return r.id||0}));
    if(d.rcptTotal)$('rcptTotal').value=d.rcptTotal;
    return true;
  }catch(e){return false}
}
function clearDraft(){try{localStorage.removeItem('mrc.scanDraft')}catch(e){}}

/* ================= apply ================= */
function applyAll(){
  var sel=rows.filter(function(r){return r.include});
  if(!sel.length)return toast('Select at least one line.','error');
  for(var i=0;i<sel.length;i++){var c=check(sel[i]).filter(function(x){return x[0]==='bad'});
    if(c.length){var el=document.querySelector('.line[data-id="'+sel[i].id+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return toast('Fix line '+(i+1)+': '+c[0][1].replace(/<[^>]+>/g,''),'error')}}
  if(!confirm((mode==='in'?'Add stock for ':'Remove stock for ')+sel.length+' line(s)? This updates your inventory.'))return;
  busy=true;summary();$('btnApply').innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving…';
  var ok=0,fail=0,failMsg='';
  sel.reduce(function(chain,r){return chain.then(function(){
    var it=itemOf(r.itemId),q=parseFloat(r.qty),cur=Number(it.quantity)||0,next=mode==='out'?cur-q:cur+q;
    if(mode==='out'&&next<0){fail++;failMsg='Not enough stock for '+it.name;r.applyErr='Not enough stock — only '+num(cur)+' available';return}
    var pl={name:it.name,sku:it.sku,category:it.category,quantity:next,unit:it.unit||'units',
      price:(mode==='in'&&r.updPrice)?parseFloat(r.price):Number(it.price)||0,
      threshold:it.threshold===undefined||it.threshold===null?10:Number(it.threshold),supplier:it.supplier||'',notes:it.notes||''};
    return api('/inventory/'+encodeURIComponent(it.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl)})
      .then(function(u){Object.assign(it,u||{},pl);aliases[norm(r.name)]=it.id;r.done=true;ok++})
      .catch(function(e){fail++;failMsg=e.message;r.applyErr='Save failed: '+e.message});
  })},Promise.resolve()).then(function(){
    try{localStorage.setItem('mrc.aliases',JSON.stringify(aliases))}catch(e){}
    rows=rows.filter(function(r){return !r.done});busy=false;render();
    if(!rows.length){$('rcptTotal').value='';$('ocrText').value='';$('preview').style.display='none';src=null;clearDraft();dirty=false}
    else saveDraft();
    toast(fail?ok+' updated, '+fail+' failed ('+failMsg+'). Failed lines are still listed.':'Inventory updated: '+ok+' line'+(ok>1?'s':'')+' applied.',fail?'error':'');
  });
}

/* ================= mode toggle ================= */
function setMode(m){
  mode=m;
  [].forEach.call($('modeSeg').children,function(x){
    var on=x.dataset.mode===m;x.classList.toggle('on',on);x.setAttribute('aria-selected',on?'true':'false');
  });
  var hint=$('modeHint');
  if(hint)hint.innerHTML=m==='in'?'Quantities will be <b>added</b> to the current balance.':'Quantities will be <b>subtracted</b> from the current balance.';
  try{localStorage.setItem('mrc.scanMode',m)}catch(e){}
  render();saveDraft();
}

/* ================= events ================= */
$('btnCam').onclick=function(){$('fileCam').click()};
$('btnUp').onclick=function(){$('fileUp').click()};
['fileCam','fileUp'].forEach(function(id){$(id).onchange=function(){loadImage(this.files[0]);this.value=''}});
$('btnAgain').onclick=function(){runOcr()};
$('btnRot').onclick=function(){if(src&&!busy){rotate();runOcr()}};
$('btnManual').onclick=function(){addRow({});render();var l=document.querySelectorAll('.line');if(l.length)l[l.length-1].scrollIntoView({behavior:'smooth',block:'center'});saveDraft()};
$('btnReparse').onclick=function(){var p=parseText($('ocrText').value);if(!p.length)return toast('No item lines found in the text.','error');
  rows=[];p.forEach(function(x){var id=matchItem(x.name,x.p);addRow({name:x.name,qty:x.q,price:x.p,total:x.t,unit:x.unit,itemId:id,conf:x.ok?'ok':'check'})});render();saveDraft();toast(p.length+' line(s) read.')};
$('btnClear').onclick=function(){if(rows.length&&confirm('Remove all lines from this screen?')){rows=[];render();clearDraft()}};
$('btnApply').onclick=applyAll;
$('retry').onclick=loadItems;
$('modeSeg').onclick=function(e){var b=e.target.closest('button');if(b)setMode(b.dataset.mode)};
$('chips').onclick=function(e){var c=e.target.closest('.chip');if(!c)return;
  [].forEach.call($('chips').children,function(x){x.classList.toggle('on',x===c)});$('pickVal').value=c.dataset.v;$('pickVal').focus()};
$('usePick').onclick=function(){var v=$('pickVal').value.trim();if(!v)return toast('Tap a piece of text or type it first.','error');go(v)};
$('pickVal').addEventListener('keydown',function(e){if(e.key==='Enter')$('usePick').click()});
window.addEventListener('beforeunload',function(e){if(!FM&&rows.length&&!busy){e.preventDefault();e.returnValue=''}});

/* ================= boot ================= */
if(FM){
  var L={name:'item name',sku:'SKU',supplier:'supplier',search:'search',lookup:'item lookup'}[FIELD]||FIELD;
  $('h1').textContent='Scan text';$('sub').innerHTML='<i class="fas fa-hard-hat"></i> Fill “'+esc(L)+'” from a photo instead of typing';
  $('capWhat').textContent='text';$('modeRow').style.display='none';$('btnManual').style.display='none';
  var back=RET+(RET.indexOf('?')<0?'?':'&')+'scanned=&field='+encodeURIComponent(FIELD);
  $('back').href=back;$('back').innerHTML='<i class="fas fa-arrow-left"></i> Back';$('cancelPick').href=back;
  document.querySelector('details summary').nextElementSibling.nextElementSibling.style.display='none';$('btnReparse').style.display='none';
}else{
  try{var sm=localStorage.getItem('mrc.scanMode');if(sm==='in'||sm==='out')mode=sm}catch(e){}
  if(loadDraft()){toast('Restored unsaved scan lines from your last session.');render();setMode(mode)}
  else{setMode(mode);loadItems()}
  if(loadDraft())loadItems();
}
setTimeout(function(){getWorker().catch(function(){})},300);
})();
</script>
</body>
</html>
